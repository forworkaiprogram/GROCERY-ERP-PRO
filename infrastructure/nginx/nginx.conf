# TLS termination + reverse proxy for the GROCERY ERP PRO backend.
# Certificates are operator-provided (see infrastructure/nginx/certs/).

server_tokens off;

server {
    listen 80;
    server_name _;
    # ACME challenges may be handled here; everything else redirects.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 512m;

    location /api/v1/updates/packages/ {
        # Release packages are served read-only from the update store.
        alias /var/lib/grocery-erp/update-storage/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    location /static/ {
        alias /var/lib/grocery-erp/static/;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
